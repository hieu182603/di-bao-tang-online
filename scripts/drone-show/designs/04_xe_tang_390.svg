  <title>Cảnh 4 — Xe tăng 390 (Type 59): hình chiếu cạnh của mô hình khung 3D</title>
  <desc>Sinh tự động từ scenes.tank_parts() (đơn vị 1/10 m, kích thước thật Type 59/T-54: thân 6,04 m, rộng 3,27 m, cao 2,59 m; 5 bánh chịu lực, khe hở giữa bánh 1–2; tháp pháo vòm; pháo 100 mm có bộ hút khói; thùng dầu phụ trên chắn bùn phải). Trong show, mô hình phóng ×4,8 và là đội hình 3D thật: xích chạy vòng, bánh quay, xe ôm cua 90° rồi húc qua cổng. Số hiệu 390 phóng to so với thật để đọc được bằng drone.</desc>
