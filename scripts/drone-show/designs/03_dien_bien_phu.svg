<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -46 120 92" width="1200" height="920">
  <title>Cảnh 3 — Lá cờ "Quyết chiến Quyết thắng" trên nóc hầm De Castries (7/5/1954)</title>
  <desc>
    Thiết kế gốc. Tư liệu: màn 700 drone tại Điện Biên Phủ 5/5/2024 ("Hình ảnh anh bộ đội phất cao lá cờ
    quyết chiến quyết thắng trên nóc hầm De Castries" — VOV); bài báo về lá cờ: "cờ đỏ sao vàng, dưới có dòng chữ
    Quyết chiến Quyết thắng" (Vũ Anh Tài phác thảo; cờ thưởng luân lưu của Chủ tịch Hồ Chí Minh từ 22/12/1953).
    Các nguồn KHÔNG nêu vị trí chính xác của sao và màu chữ; ở đây sao đặt ở nửa trên, chữ vàng ở nửa dưới
    (cách điệu). Dòng phụ "giải thưởng luân lưu của Hồ Chủ tịch" quá nhỏ để thể hiện bằng drone nên lược bỏ.
    Lớp chiều sâu: núi xa z=-22, núi giữa z=-11, đồi gần + hầm + chiến sĩ z=0, cờ z=+2, năm 1954 z=+4.
    Cột cờ + cánh tay + lá cờ là một khối quay quanh tay dưới của chiến sĩ (hoạt cảnh "giương cờ").
  </desc>
  <rect x="-60" y="-46" width="120" height="92" fill="#050814" data-skip="1"/>
  <g fill="none" stroke-width="0.4" data-smooth="1">
    <!-- NÚI: ba lớp -->
    <g data-group="db_mtn_far" data-z="-22" stroke="#4aa8ff" data-bright="0.55" data-prio="0.8" data-sp="1.1">
      <polyline points="-60,10 -52,0 -45,-3 -38,-11 -31,-6 -24,-9 -17,-15 -9,-8 -2,-11 6,-17 14,-9 22,-12 30,-6 38,-13 46,-6 53,-3 60,4"/>
    </g>
    <g data-group="db_mtn_mid" data-z="-11" stroke="#38e0a8" data-bright="0.7" data-prio="0.85" data-sp="1.0">
      <polyline points="-60,20 -51,12 -43,14 -35,6 -27,10 -19,4 -10,9 -1,3 8,8 17,2 26,8 35,4 44,11 52,8 60,14"/>
    </g>
    <g data-group="db_mtn_near" stroke="#6cff8a" data-bright="0.85" data-prio="0.9" data-sp="0.95">
      <polyline points="-60,32 -50,27 -40,26 -30,22 -24,19 -18,18 -6,18 2,19 12,23 24,25 36,24 48,28 60,30"/>
    </g>
    <g data-group="db_mtn_near" data-mode="fill" data-bright="0.18" data-fsp="2.2" data-prio="0.2">
      <polygon fill="#3cd070" data-smooth="0" points="-60,33 -50,28 -40,27 -30,23 -24,20 -18,19 -6,19 2,20 12,24 24,26 36,25 48,29 60,31 60,34 -60,34"/>
    </g>
    <!-- HẦM chỉ huy (vòm thép phủ bao cát) -->
    <g data-group="db_bunker" stroke="#ffe7b0" data-bright="0.85" data-prio="0.8" data-sp="0.85">
      <polyline points="-23,18.4 -21,13.4 -17,10.6 -12,9.8 -7,10.6 -3,13.4 -1,18.4"/>
      <polyline points="-20,16.4 -12,14.8 -4,16.4" data-bright="0.55"/>
      <polyline points="-18.6,13.2 -12,12.2 -5.4,13.2" data-bright="0.55"/>
      <polyline points="-14.6,18.4 -14.6,15.6 -9.4,15.6 -9.4,18.4" data-smooth="0" stroke="#ffb64a"/>
    </g>
    <!-- CHIẾN SĨ (dáng nghiêng, hướng sang phải, chân choãi trên nóc hầm) -->
    <g data-group="db_soldier" stroke="#fff3dc" data-prio="0.95" data-sp="0.6">
      <polygon data-smooth="0" points="-16.0,10.3 -18.6,10.3 -18.2,8.8 -16.2,5.2 -14.8,1.8 -15.2,-1.6 -14.8,-5.4 -13.6,-7.6 -14.6,-8.6 -14.0,-11.2 -12.2,-12.8 -9.8,-12.6 -8.4,-10.8 -7.4,-9.4 -8.6,-9.2 -8.0,-8.0 -8.6,-7.4 -9.2,-6.6 -9.4,-6.0 -8.8,-4.4 -9.0,-0.4 -10.0,1.4 -7.6,5.0 -7.4,9.2 -5.4,10.3 -8.6,10.3 -9.2,8.6 -9.8,5.4 -12.6,3.2 -14.2,5.6 -16.2,9.2"/>
      <polyline points="-14.8,-9.0 -7.0,-9.6" data-smooth="0" stroke="#ffe7b0"/>
      <polyline points="-14.9,-0.6 -9.0,-0.6" data-smooth="0" stroke="#ffb64a"/>
      <polyline points="-12.6,-12.8 -13.4,-14.2" stroke="#7dff8a"/><polyline points="-10.8,-12.9 -10.4,-14.4" stroke="#7dff8a"/>
      <polyline points="-14.9,-5.2 -17.2,-5.2 -17.2,-1.2 -15.1,-1.2" data-smooth="0" stroke="#ffb64a" data-bright="0.8"/>
      <polyline points="-16.4,-7.6 -18.8,0.6" data-smooth="0" stroke="#ffb64a" data-bright="0.75"/>
    </g>
    <g data-group="db_soldier" data-mode="fill" data-bright="0.32" data-fsp="1.1" data-prio="0.3">
      <polygon fill="#fff3dc" data-smooth="0" points="-14.6,-5.2 -9.2,-5.4 -9.0,-0.6 -14.8,-0.6"/>
    </g>
    <!-- KHỐI GIƯƠNG CỜ: hai tay + cột + cờ (quay quanh tay dưới -8.5,-3.6) -->
    <g data-group="db_arm" stroke="#fff3dc" data-prio="0.95" data-sp="0.55">
      <polyline points="-9.6,-5.8 -5.6,-7.4 -6.6,-11.8"/>
      <polyline points="-9.2,-4.9 -6.6,-6.3 -7.4,-11.2" data-bright="0.6"/>
      <polyline points="-12.6,-5.4 -11.0,-2.6 -8.6,-3.4"/>
      <circle cx="-6.9" cy="-12.0" r="0.8" fill="#fff3dc"/>
      <circle cx="-8.5" cy="-3.6" r="0.7" fill="#fff3dc"/>
    </g>
    <g data-group="db_pole" stroke="#ffd36a" data-prio="0.95" data-sp="0.55" data-smooth="0">
      <polyline points="-9.2,1.0 -3.2,-37.8"/>
      <circle cx="-3.1" cy="-38.6" r="0.7" fill="#ffe9a0"/>
    </g>
    <g transform="translate(-3.2,-37.8) rotate(8.8)">
      <g data-group="db_flag" data-z="2" stroke="#ff2c1c" data-color="#ff2c1c" data-bright="0.92" data-prio="0.75">
        <rect x="0" y="0" width="40" height="28" fill="none" data-sp="0.85"/>
        <path fill="#da251d" data-mode="fill" data-fsp="0.98" data-prio="0.4" data-smooth="0" fill-rule="evenodd"
              d="M0,0 H40 V28 H0 Z M20.0,1.8 L21.212,5.531 L25.136,5.531 L21.962,7.837 L23.174,11.569 L20.0,9.263 L16.826,11.569 L18.038,7.837 L14.864,5.531 L18.788,5.531 Z"/>
      </g>
      <g data-group="db_flag_star" data-z="2.2" stroke="#ffd61e" data-prio="1" data-sp="0.55" data-smooth="0">
        <polygon fill="#ffd61e" data-fsp="0.75" points="20.0,1.8 21.212,5.531 25.136,5.531 21.962,7.837 23.174,11.569 20.0,9.263 16.826,11.569 18.038,7.837 14.864,5.531 18.788,5.531"/>
      </g>
      <g data-group="db_flag_text" data-z="2.2" data-prio="0.7" data-sp="0.5">
        <text x="20" y="18.8" font-size="5.0" text-anchor="middle" fill="#ffd61e" data-font="stroke" data-tracking="0.2">QUYẾT CHIẾN</text>
        <text x="20" y="26.0" font-size="5.0" text-anchor="middle" fill="#ffd61e" data-font="stroke" data-tracking="0.2">QUYẾT THẮNG</text>
      </g>
    </g>
    <!-- NĂM 1954 -->
    <text x="0" y="44.2" font-size="9.2" text-anchor="middle" fill="#ffe2a0" data-font="stroke" data-group="year"
          data-z="4" data-prio="0.5" data-sp="0.55" data-tracking="0.6">1954</text>
  </g>
</svg>
