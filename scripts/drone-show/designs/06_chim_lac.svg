<svg xmlns="http://www.w3.org/2000/svg" viewBox="-45 -36 80 72" width="800" height="720">
  <title>Cảnh 6 — Chim Lạc dang cánh</title>
  <desc>Thiết kế gốc theo lối khắc chim bay trên trống đồng Đông Sơn: thân và cánh nhìn từ trên xuống, đầu nhìn nghiêng; mỏ dài, có mào, cổ dài, chân/đuôi dài, thân thon kiểu cò–sếu–vạc. Cánh trên/dưới là hai nhóm (bird_wing_u / bird_wing_d) để engine vỗ cánh 3D quanh trục thân. Toạ độ mét, y xuống.</desc>
  <rect x="-45" y="-36" width="80" height="72" fill="#050814" data-skip="1"/>
  <g fill="none" stroke-width="0.35" data-smooth="1">
