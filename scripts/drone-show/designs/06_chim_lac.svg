      <polyline points="16.4,-5 15,-7.4 13,-8.6 11.6,-8.2" stroke="#ff7a2a" data-sp="0.6"/>
      <polyline points="15.6,-6 14.6,-9.6 12.6,-11.4" stroke="#ff7a2a" data-sp="0.6"/>
      <circle cx="16.6" cy="-4.0" r="0.35" fill="#ff3a24" stroke="#ff3a24" data-sp="0.4"/>
    </g>
    <g data-group="bird_wing_u" stroke="#ffd36a" data-prio="0.9" data-sp="0.62" data-p0="-1">
      <polygon points="2,-1.6 -1,-8 -5,-15 -10,-22 -15,-28 -21,-32 -19.5,-27.5 -22.5,-24.5 -18,-22 -20.5,-18.5 -15,-16 -17,-12 -11,-9.5 -12.5,-6 -6,-3 -4,-1.4" fill="#ffd36a" data-fsp="1.55" data-bright="0.95"/>
