      <polyline points="-14,-0.6 -8,-1.4 -2,-1.6 4,-1.4 8,-1.6 11,-2.6 13.2,-4.2 15.4,-4.4"/>
      <polyline points="15.4,-3 17.2,-3.6 17.6,-4.4 16.6,-5 15.4,-4.4"/>
      <polyline points="17.4,-3.8 24,-2.2 30,-0.6" stroke="#ffd36a" data-sp="0.6"/>
