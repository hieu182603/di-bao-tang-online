<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 1350" width="960" height="1350">
  <title>Cảnh 5 — Chân dung Chủ tịch Hồ Chí Minh (thiết kế nét cho đội hình drone)</title>
  <desc>
    Can tay theo ảnh chân dung khoảng năm 1946 (public domain, Wikimedia Commons; bản trong dự án:
    Frontend/images/sanh/bac_ho_1946.jpg). Toạ độ = pixel của ảnh gốc 960×1350; bộ dựng quy đổi sang mét
    (chiều cao khung 92 m). Không dùng ảnh trực tiếp trên bầu trời: ảnh chỉ là tư liệu tham chiếu để can nét,
    còn phần tô dùng độ sáng ảnh để quyết định độ sáng từng LED.
    data-smooth="1": nét được làm mượt bằng spline Catmull-Rom đi qua các điểm can.
  </desc>
  <image href="../../../Frontend/images/sanh/bac_ho_1946.jpg" x="0" y="0" width="960" height="1350" opacity="0.45" data-skip="1"/>

  <g fill="none" stroke="#ffd98a" stroke-width="5" data-smooth="1">
