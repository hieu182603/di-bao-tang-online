      <!-- mái tóc bạc chải ngược: lọn bồng ở hai thái dương, lọn mảnh trên đỉnh -->
      <polyline points="190,468 174,400 178,330 206,262"/>
      <polyline points="232,440 216,370 226,300 262,240"/>
