<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -22 104 44" width="1300" height="550">
  <title>Cảnh 2 — Rồng thời Lý: các bộ phận gắn trên spline thân</title>
  <desc>
    Thiết kế gốc theo đặc điểm rồng thời Lý (Wikipedia "Rồng Việt Nam" mục Rồng thời Lý; mô tả màn drone
    "Rực rỡ Thăng Long" 2024: "đầu có bờm dài, không có sừng, cằm có râu, miệng ngậm viên ngọc, thân hẹp, dài"):
      - cổ ngước cao; mắt to tròn hơi lồi; mày xoắn; mũi kéo dài thành hình vòi cong lên;
      - hàm dưới uốn hình sin; miệng há rộng; lưỡi dài uốn lượn đỡ viên ngọc; răng nanh cong;
      - tai nhỏ; sừng không thể hiện rõ (bỏ); bờm dài bay ngược như cờ đuôi nheo; chòm râu cằm xoắn;
      - 4 chân, mỗi chân 3 móng, có túm lửa ở khuỷu; đuôi thon nhọn kết túm lửa.
    Thân rồng (không vẽ ở đây) được sinh theo spline: ống tròn thu nhỏ dần về đuôi, phủ vảy.
    Mỗi nhóm có toạ độ cục bộ riêng (data-origin = gốc của khung): đầu — gốc tại đỉnh cổ, x hướng mõm;
    chân — gốc tại điểm gắn dưới bụng, x hướng về phía đầu, y hướng xuống; đuôi — gốc tại chót đuôi.
    Đơn vị mét, y SVG hướng xuống.
  </desc>
  <rect x="-24" y="-22" width="104" height="44" fill="#050814" data-skip="1"/>
  <g fill="none" stroke-width="0.35" data-smooth="1">
    <!-- ĐẦU (gốc 0,0) -->
    <g data-group="dr_head" data-origin="0,0" stroke="#ffc34a" data-prio="1" data-sp="0.7">
      <polyline points="-1.5,-3.4 0.4,-6.4 3.4,-7.8 6.2,-7.3 7.7,-5.7 10.4,-5.2 13.1,-5.6 14.6,-7.1 14.3,-8.4 13.2,-8.1"/>
      <polyline points="14.5,-5.0 13.0,-3.8 10.6,-3.4 8.4,-3.0 6.6,-2.0"/>
      <polyline points="6.6,-2.0 8.6,-0.6 10.8,0.2 12.6,0.0 13.7,0.8 13.1,1.8 11.0,2.2 8.4,2.4 5.6,1.8 3.0,0.8 1.0,1.6"/>
      <circle cx="6.1" cy="-4.9" r="1.35" stroke="#fff3d6" data-sp="0.55"/>
      <circle cx="6.5" cy="-4.9" r="0.35" stroke="#ff3a24" fill="#ff3a24" data-sp="0.4"/>
      <polyline points="4.5,-6.3 5.7,-7.6 7.3,-7.5 7.6,-6.6 7.0,-6.2" stroke="#ffe08a" data-sp="0.55"/>
      <polyline points="12.6,-6.6 13.3,-6.0 12.7,-5.6" stroke="#ffe08a" data-sp="0.5"/>
      <polyline points="12.3,-3.7 12.1,-2.2" stroke="#fff3d6" data-sp="0.5"/>
      <polyline points="12.0,0.0 11.7,-1.2" stroke="#fff3d6" data-sp="0.5"/>
      <polyline points="2.2,-6.0 0.7,-7.8 2.6,-7.5 3.4,-6.2" stroke="#ffe08a" data-sp="0.55"/>
      <polyline points="8.0,-1.2 11.0,-1.6 14.5,-1.2 16.8,-0.4 17.6,-1.8 16.8,-3.0" stroke="#ff5a3a" data-sp="0.55"/>
    </g>
    <!-- VIÊN NGỌC + lửa -->
    <g data-group="dr_pearl" data-origin="0,0" stroke="#fffbe8" data-prio="0.95" data-sp="0.5">
      <circle cx="18.9" cy="-3.9" r="2.1" fill="#fff4cc" data-fsp="0.55"/>
      <g stroke="#ffb03a" data-sp="0.6">
        <polyline points="18.9,-6.6 18.4,-8.0 19.2,-9.0"/><polyline points="21.4,-5.6 22.6,-6.6 23.0,-7.8"/>
        <polyline points="21.9,-3.0 23.4,-2.6 24.2,-3.4"/><polyline points="16.6,-6.0 15.6,-7.2 15.8,-8.4"/>
        <polyline points="20.8,-1.2 21.6,0.2 21.0,1.2"/>
      </g>
    </g>
    <!-- BỜM bay ngược (cờ đuôi nheo) -->
    <g data-group="dr_mane" data-origin="0,0" stroke="#ff9a2a" data-prio="0.8" data-sp="0.8">
      <polyline points="0.4,-6.4 -3.0,-9.5 -7.5,-10.8 -12.0,-10.2 -16.0,-11.6"/>
      <polyline points="-0.6,-5.0 -4.0,-7.2 -8.5,-7.6 -12.5,-6.8 -15.4,-8.0"/>
      <polyline points="2.4,-7.6 0.5,-11.0 -3.0,-13.0 -7.0,-13.2 -10.2,-14.6"/>
      <polyline points="-1.4,-3.2 -5.0,-4.4 -8.8,-3.6 -11.6,-4.6"/>
    </g>
    <!-- RÂU: râu mõm cong lên, chòm râu cằm xoắn -->
    <g data-group="dr_whisker" data-origin="0,0" stroke="#ffe08a" data-prio="0.8" data-sp="0.7">
      <polyline points="13.2,-6.9 11.8,-9.0 9.2,-9.9 7.0,-9.4"/>
      <polyline points="8.4,2.4 7.6,4.8 5.6,6.4 4.0,6.0 4.4,4.8"/>
      <polyline points="10.6,2.2 10.4,5.0 8.8,7.0 7.4,6.8"/>
    </g>
    <!-- CHÂN (gốc 40,0: x hướng về đầu, y hướng xuống) — 3 móng + túm lửa khuỷu -->
    <g data-group="dr_leg" data-origin="40,0" stroke="#ffc34a" data-prio="0.7" data-sp="0.75">
      <polyline points="40,0 38.6,3.6 38.4,5.0"/>
      <polyline points="38.4,5.0 40.6,7.0 42.2,7.6"/>
      <polyline points="42.2,7.6 43.8,7.0 44.6,6.0" stroke="#fff3d6" data-sp="0.55"/>
      <polyline points="42.2,7.6 44.2,8.2 45.0,8.0" stroke="#fff3d6" data-sp="0.55"/>
      <polyline points="42.2,7.6 43.0,9.4 43.8,9.8" stroke="#fff3d6" data-sp="0.55"/>
      <polyline points="38.6,4.4 36.6,4.6 35.2,5.6" stroke="#ff7a2a" data-sp="0.6"/>
      <polyline points="38.6,3.2 36.8,2.8 35.6,3.4" stroke="#ff7a2a" data-sp="0.6"/>
    </g>
    <!-- ĐUÔI (gốc 60,0: x hướng ra sau đuôi) — túm lửa -->
    <g data-group="dr_tail" data-origin="60,0" stroke="#ff9a2a" data-prio="0.7" data-sp="0.7">
      <polyline points="60,0 63,-1.6 66.4,-1.2 68.6,-3.0"/>
      <polyline points="60,0 63.4,0.4 67.0,1.6 69.4,1.0"/>
      <polyline points="61.2,-0.8 63.6,-3.4 64.8,-5.6"/>
      <polyline points="61.2,0.6 63.0,2.8 63.4,4.8"/>
    </g>
  </g>
</svg>
