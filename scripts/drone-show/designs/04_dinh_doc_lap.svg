<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -42 120 80" width="1200" height="800">
  <title>Cảnh 4 — Dinh Độc Lập, cổng chính (30/4/1975)</title>
  <desc>Cách điệu mặt tiền Dinh Độc Lập (KTS Ngô Viết Thụ, 1962–1966): mái đua dài, hai tầng 'rèm hoa đá' cách điệu đốt mành trúc, khoang kính giữa, tầng trệt có cột, sảnh có mái hiên, bậc thềm, hai hồ sen bán nguyệt, khối sân thượng với cột cờ. Phía trước (z=+12): cổng chính hai cánh + hàng rào song sắt. Hai cánh cổng là nhóm riêng (gate_l / gate_r, data-p0 = toạ độ bản lề) để engine quay mở trong 3D. Lá cờ trên nóc tắt đèn (data-dark) cho tới cuối cảnh. Không sao chép ảnh hay thiết kế drone có sẵn.</desc>
